<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#23373b"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eb811b"/></marker></defs><g font-family="Fira Sans, sans-serif"><rect x="45" y="110" width="280" height="80" rx="12" fill="#edf3f4" stroke="#23373b" stroke-width="2"/><text x="185.0" y="159.0" font-size="28" text-anchor="middle" fill="#23373b">Observe / update</text><rect x="360" y="110" width="280" height="80" rx="12" fill="#edf3f4" stroke="#23373b" stroke-width="2"/><text x="500.0" y="159.0" font-size="28" text-anchor="middle" fill="#23373b">Deliberate / plan</text><rect x="675" y="110" width="280" height="80" rx="12" fill="#edf3f4" stroke="#23373b" stroke-width="2"/><text x="815.0" y="159.0" font-size="28" text-anchor="middle" fill="#23373b">Execute a step</text><path d="M330 150 L350 150" fill="none" stroke="#23373b" stroke-width="3" marker-end="url(#arrow)"/><path d="M645 150 L665 150" fill="none" stroke="#23373b" stroke-width="3" marker-end="url(#arrow)"/><text x="185" y="75" font-size="30" text-anchor="middle" fill="#23373b">t₀</text><text x="500" y="75" font-size="30" text-anchor="middle" fill="#23373b">t₁</text><text x="815" y="75" font-size="30" text-anchor="middle" fill="#23373b">t₂</text><path d="M70 280 L940 280" stroke="#eb811b" stroke-width="5"/><text x="500" y="330" font-size="27" text-anchor="middle" fill="#23373b">The environment may change throughout the whole interval.</text></g></svg>